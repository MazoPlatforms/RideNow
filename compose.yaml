services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ride-local
      RUSTFS_SECRET_KEY: ride-local-password
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["storage-data:/data"]
  clamav:
    image: clamav/clamav:stable
    profiles: [scanner]
    ports: ["127.0.0.1:3310:3310"]
volumes:
  postgres-data:
  storage-data:
