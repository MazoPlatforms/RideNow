name: Sora Android APK temporary artifact

on:
  push:
    branches:
      - feature/sora-auth-otp
    paths:
      - 'app/android/**'
      - '.github/workflows/android-sora-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sora-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feature/sora-auth-otp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate the missing Gradle wrapper outside the app project
        run: |
          wrapper_dir="$RUNNER_TEMP/ridenow-sora-wrapper"
          mkdir -p "$wrapper_dir"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$wrapper_dir/settings.gradle.kts"
          gradle --no-daemon --project-dir "$wrapper_dir" wrapper --gradle-version 8.9 --distribution-type bin --no-validate-url
          cp "$wrapper_dir/gradlew" app/android/gradlew
          cp "$wrapper_dir/gradlew.bat" app/android/gradlew.bat
          cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" app/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x app/android/gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build debug APK
        run: app/android/gradlew --no-daemon --stacktrace --project-dir app/android :app:assembleDebug
      - name: Stage the temporary artifact
        run: |
          mkdir -p artifacts
          cp app/android/app/build/outputs/apk/debug/app-debug.apk artifacts/RideNow-Sora-debug.apk
          sha256sum artifacts/RideNow-Sora-debug.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridenow-sora-apk-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
