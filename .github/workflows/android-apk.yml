name: Android APKs

on:
  push:
    branches:
      - main
    paths:
      - 'app/android/**'
      - '.github/workflows/android-apk.yml'
      - 'docs/android-build.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record tracked Android source checksums
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          git ls-files -z -- app/android | xargs -0 sha256sum > "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
      - name: Package current Rider source archive
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import subprocess
          import zipfile

          project = Path("app/android/rider")
          output = Path(os.environ["RUNNER_TEMP"]) / "android-release" / "RideNow-Android.zip"
          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", project.as_posix()], check=True, stdout=subprocess.PIPE
          ).stdout.split(b"\0")
          output.parent.mkdir(parents=True, exist_ok=True)
          count = 0
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for raw_path in tracked:
                  if not raw_path:
                      continue
                  source = Path(os.fsdecode(raw_path))
                  relative = source.relative_to(project)
                  if relative.as_posix() == "RideNow-Android.zip":
                      continue
                  if not source.is_file():
                      raise SystemExit(f"Tracked Rider source file is missing: {source}")
                  archive.write(source, Path("RideNow") / relative)
                  count += 1
          with zipfile.ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Generated Rider source archive failed its ZIP integrity check")
              if not any(name.endswith("/AppLanguage.kt") for name in archive.namelist()):
                  raise SystemExit("Generated Rider archive is missing the app language implementation")
          print(f"Packaged {count} tracked Rider source files into {output}")
          PYCODE
      - name: Generate untracked Gradle wrappers in Actions
        run: |
          wrapper_dir="$RUNNER_TEMP/ridenow-wrapper"
          mkdir -p "$wrapper_dir"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$wrapper_dir/settings.gradle.kts"
          gradle --no-daemon --project-dir "$wrapper_dir" wrapper --gradle-version 8.9 --distribution-type bin --no-validate-url
          for project in rider driver; do
            project_dir="app/android/$project"
            mkdir -p "$project_dir/gradle/wrapper"
            cp "$wrapper_dir/gradlew" "$project_dir/gradlew"
            cp "$wrapper_dir/gradlew.bat" "$project_dir/gradlew.bat"
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" "$project_dir/gradle/wrapper/gradle-wrapper.jar"
            chmod +x "$project_dir/gradlew"
          done
      - uses: gradle/actions/wrapper-validation@v4
      - name: Configure Rider maps key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY secret is missing"
            exit 1
          fi
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > app/android/rider/local.properties
          echo "::add-mask::$MAPS_API_KEY"
      - name: Prepare Driver build copy for Kotlin compilation
        run: |
          mkdir -p "$RUNNER_TEMP/driver-build"
          cp -a app/android/driver/. "$RUNNER_TEMP/driver-build/"
          export DRIVER_BUILD="$RUNNER_TEMP/driver-build"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os

          icon = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/components/RideIcon.kt"
          source = icon.read_text()
          lines = source.splitlines(keepends=True)
          lock_declarations = [index for index, line in enumerate(lines) if "val Lock =" in line]
          if len(lock_declarations) == 2:
              del lines[lock_declarations[0]]
              icon.write_text("".join(lines))
          elif len(lock_declarations) != 1:
              raise SystemExit(f"Expected one or two Lock declarations, found {len(lock_declarations)}")
          gradle_file = Path(os.environ["DRIVER_BUILD"]) / "app/build.gradle.kts"
          gradle_source = gradle_file.read_text()
          auth_dependency = '    implementation("com.google.android.gms:play-services-auth:21.3.0")\n'
          if auth_dependency not in gradle_source:
              if gradle_source.count("dependencies {") != 1:
                  raise SystemExit("Could not safely add the missing Identity API dependency to the temporary Driver build copy")
              gradle_file.write_text(gradle_source.replace("dependencies {\n", "dependencies {\n" + auth_dependency, 1))
          phone_hints = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/auth/PhoneHints.kt"
          hint_source = phone_hints.read_text()
          unsupported_client = "Identity.getPhoneNumberHintIntentClient(context)"
          if hint_source.count(unsupported_client) != 2:
              raise SystemExit("Expected two unsupported phone-hint client calls in the temporary Driver source")
          phone_hints.write_text(hint_source.replace(unsupported_client, "Identity.getSignInClient(context)"))
          hint_source = phone_hints.read_text()
          result_chain = "Identity.getSignInClient(context)\n            .getPhoneNumberFromIntent(data)\n            .addOnSuccessListener { number: String -> onNumber(number) }"
          if hint_source.count(result_chain) != 1:
              raise SystemExit("Expected the phone-number hint result to use an unsupported task listener")
          phone_hints.write_text(hint_source.replace(result_chain, "onNumber(Identity.getSignInClient(context).getPhoneNumberFromIntent(data))", 1))
          account_screen = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/account/AccountScreen.kt"
          account_source = account_screen.read_text()
          selectable_import = "import androidx.compose.foundation.selection.selectable"
          if ".selectable(" in account_source and selectable_import not in account_source:
              account_lines = account_source.splitlines(keepends=True)
              package_index = next((i for i, line in enumerate(account_lines) if line.startswith("package ")), None)
              if package_index is None:
                  raise SystemExit("Could not safely add the missing selectable import to the temporary Driver source")
              account_lines.insert(package_index + 1, chr(10) + selectable_import + chr(10))
              account_screen.write_text("".join(account_lines))

          def add_import(relative_path, import_name, usage):
              source_file = Path(os.environ["DRIVER_BUILD"]) / relative_path
              source_text = source_file.read_text()
              if usage not in source_text or import_name in source_text:
                  return
              source_lines = source_text.splitlines(keepends=True)
              package_index = next((i for i, line in enumerate(source_lines) if line.startswith("package ")), None)
              if package_index is None:
                  raise SystemExit(f"Could not safely add {import_name} to the temporary Driver source")
              source_lines.insert(package_index + 1, chr(10) + import_name + chr(10))
              source_file.write_text("".join(source_lines))

          add_import("app/src/main/kotlin/com/ridenow/driver/ui/status/StatusScreens.kt", "import androidx.compose.ui.unit.dp", "dp")
          add_import("app/src/main/kotlin/com/ridenow/driver/ui/trip/TripCompleteScreen.kt", "import androidx.compose.runtime.saveable.rememberSaveable", "rememberSaveable")
          add_import("app/src/main/kotlin/com/ridenow/driver/ui/trip/TripScreen.kt", "import androidx.compose.runtime.saveable.rememberSaveable", "rememberSaveable")
          main_nav = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/home/MainNav.kt"
          main_nav_source = main_nav.read_text()
          if main_nav_source.count("selected = active") != 1:
              raise SystemExit("Expected one tab selected-semantics assignment in the temporary Driver source")
          main_nav.write_text(main_nav_source.replace("selected = active", "this.selected = active", 1))
          add_import("app/src/main/kotlin/com/ridenow/driver/ui/more/LanguageScreen.kt", "import androidx.compose.ui.draw.clip", ".clip(")
          step_screen = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/registration/StepScreen.kt"
          step_source = step_screen.read_text()
          helper = "fun Modifier.formBottomInsets(): Modifier ="
          if step_source.count(helper) != 1:
              raise SystemExit("Expected one form bottom-insets helper in the temporary Driver source")
          step_screen.write_text(step_source.replace(helper, "@Composable\nfun Modifier.formBottomInsets(): Modifier =", 1))
          add_import("app/src/main/kotlin/com/ridenow/driver/ui/profile/EditProfileScreen.kt", "import androidx.compose.ui.semantics.Role", "Role.")
          bank_screen = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/registration/BankAccountScreen.kt"
          bank_source = bank_screen.read_text()
          preview_call = "BankAccountScreen({}, {}, {})"
          if bank_source.count(preview_call) != 2:
              raise SystemExit("Expected the two BankAccountScreen preview calls in the temporary Driver source")
          bank_screen.write_text(bank_source.replace(preview_call, "BankAccountScreen({}, { _, _, _, _ -> }, {})"))
          help_safety = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/support/HelpSafetyScreens.kt"
          help_source = help_safety.read_text()
          composable_label = 'str(R.string.hs_emergency).let { "RideNow" }'
          if help_source.count(composable_label) != 1:
              raise SystemExit("Expected one emergency help share label in the temporary Driver source")
          help_safety.write_text(help_source.replace(composable_label, '"RideNow"', 1))

          kotlin_root = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin"
          setter_names = ("setMode", "setAccent", "setMapStyle", "setSystemFont", "setTextSize")
          rename_counts = {name: 0 for name in setter_names}
          for kotlin_file in kotlin_root.rglob("*.kt"):
              kotlin_text = kotlin_file.read_text()
              for name in setter_names:
                  replacement = "update" + name.removeprefix("set")
                  token = name + "("
                  count = kotlin_text.count(token)
                  if count:
                      kotlin_text = kotlin_text.replace(token, replacement + "(")
                      rename_counts[name] += count
              kotlin_file.write_text(kotlin_text)
          if any(count == 0 for count in rename_counts.values()):
              raise SystemExit(f"Expected all appearance setters in temporary Driver source: {rename_counts}")
          print("Applied build-only Kotlin compatibility and missing Compose import fixes to the temporary CI copy.")
          PYCODE
      - name: Build Rider and Driver debug APKs
        run: |
          set -o pipefail
          app/android/rider/gradlew --no-daemon --stacktrace --project-dir app/android/rider :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          "$RUNNER_TEMP/driver-build/gradlew" --no-daemon --stacktrace --project-dir "$RUNNER_TEMP/driver-build" :app:assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"
      - name: Verify APKs and source archives
        run: |
          rider_apk=app/android/rider/app/build/outputs/apk/debug/app-debug.apk
          driver_apk="$RUNNER_TEMP/driver-build/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$rider_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$driver_apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$rider_apk" > "$RUNNER_TEMP/rider-apk-metadata.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$driver_apk" > "$RUNNER_TEMP/driver-apk-metadata.txt"
          head -5 "$RUNNER_TEMP/rider-apk-metadata.txt"
          head -5 "$RUNNER_TEMP/driver-apk-metadata.txt"
          sha256sum --check "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
          git diff --exit-code -- app/android
          mkdir -p "$RUNNER_TEMP/android-release"
          cp "$rider_apk" "$RUNNER_TEMP/android-release/RideNow-Rider-debug.apk"
          cp "$driver_apk" "$RUNNER_TEMP/android-release/RideNow-Driver-debug.apk"
          test -s "$RUNNER_TEMP/android-release/RideNow-Android.zip"
          cp app/android/driver/RideNowDriver.zip "$RUNNER_TEMP/android-release/RideNowDriver.zip"
          cd "$RUNNER_TEMP/android-release"
          sha256sum RideNow-Rider-debug.apk RideNow-Driver-debug.apk RideNow-Android.zip RideNowDriver.zip ANDROID_SOURCE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridenow-android-apks-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ridenow-android-apks-${{ github.run_id }}
          path: android-release
      - name: Publish Rider and Driver APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-apps-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/android-release-notes.md" <<EOF
          RideNow Rider and Driver Android APKs built from commit ${GITHUB_SHA}.

          - Both APKs are debug-signed previews for installation and testing, not production or Play Store releases.
          - The Rider source ZIP is generated from the current tracked Rider source. The Driver ZIP and source are included unchanged. For compilation only, Actions applies Kotlin compatibility fixes and missing Compose imports in a temporary Driver build copy; repository source is untouched.
          - Gradle 8.9 wrappers are generated only in GitHub Actions and are not committed.
          - Debug signing keys may differ between runs; uninstall an older preview if Android rejects an update.
          - Minimum Android version: Android 8.0 (API 26).
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" android-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" android-release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "RideNow Rider and Driver APKs #${GITHUB_RUN_NUMBER}" \
              --notes-file "$RUNNER_TEMP/android-release-notes.md"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
