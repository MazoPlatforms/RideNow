name: Android APKs

on:
  push:
    branches:
      - main
    paths:
      - 'app/android/**'
      - '.github/workflows/android-apk.yml'
      - 'docs/android-build.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record tracked Android source checksums
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          git ls-files -z -- app/android | xargs -0 sha256sum > "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
      - name: Generate untracked Gradle wrappers in Actions
        run: |
          wrapper_dir="$RUNNER_TEMP/ridenow-wrapper"
          mkdir -p "$wrapper_dir"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$wrapper_dir/settings.gradle.kts"
          gradle --no-daemon --project-dir "$wrapper_dir" wrapper --gradle-version 8.9 --distribution-type bin --no-validate-url
          for project in rider driver; do
            project_dir="app/android/$project"
            mkdir -p "$project_dir/gradle/wrapper"
            cp "$wrapper_dir/gradlew" "$project_dir/gradlew"
            cp "$wrapper_dir/gradlew.bat" "$project_dir/gradlew.bat"
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" "$project_dir/gradle/wrapper/gradle-wrapper.jar"
            chmod +x "$project_dir/gradlew"
          done
      - uses: gradle/actions/wrapper-validation@v4
      - name: Configure Rider maps key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY secret is missing"
            exit 1
          fi
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > app/android/rider/local.properties
          echo "::add-mask::$MAPS_API_KEY"
      - name: Prepare Driver build copy for Kotlin compilation
        run: |
          mkdir -p "$RUNNER_TEMP/driver-build"
          cp -a app/android/driver/. "$RUNNER_TEMP/driver-build/"
          export DRIVER_BUILD="$RUNNER_TEMP/driver-build"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os

          icon = Path(os.environ["DRIVER_BUILD"]) / "app/src/main/kotlin/com/ridenow/driver/ui/components/RideIcon.kt"
          source = icon.read_text()
          declaration = '    val Lock = listOf("M5,9h10v8h-10z", "M7 9V7a3 3 0 0 1 6 0v2")\n'
          if source.count("val Lock =") != 2 or source.count(declaration) != 1:
              raise SystemExit("Expected the supplied Driver source's unused duplicate Lock declaration exactly once")
          icon.write_text(source.replace(declaration, "", 1))
          print("Removed one unused duplicate Lock declaration from the temporary CI build copy only.")
          PYCODE
      - name: Build Rider and Driver debug APKs
        run: |
          set -o pipefail
          app/android/rider/gradlew --no-daemon --stacktrace --project-dir app/android/rider :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          "$RUNNER_TEMP/driver-build/gradlew" --no-daemon --stacktrace --project-dir "$RUNNER_TEMP/driver-build" :app:assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"
      - name: Verify APKs and source archives
        run: |
          rider_apk=app/android/rider/app/build/outputs/apk/debug/app-debug.apk
          driver_apk="$RUNNER_TEMP/driver-build/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$rider_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$driver_apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$rider_apk" > "$RUNNER_TEMP/rider-apk-metadata.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$driver_apk" > "$RUNNER_TEMP/driver-apk-metadata.txt"
          head -5 "$RUNNER_TEMP/rider-apk-metadata.txt"
          head -5 "$RUNNER_TEMP/driver-apk-metadata.txt"
          sha256sum --check "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
          git diff --exit-code -- app/android
          mkdir -p "$RUNNER_TEMP/android-release"
          cp "$rider_apk" "$RUNNER_TEMP/android-release/RideNow-Rider-debug.apk"
          cp "$driver_apk" "$RUNNER_TEMP/android-release/RideNow-Driver-debug.apk"
          cp app/android/rider/RideNow-Android.zip "$RUNNER_TEMP/android-release/RideNow-Android.zip"
          cp app/android/driver/RideNowDriver.zip "$RUNNER_TEMP/android-release/RideNowDriver.zip"
          cd "$RUNNER_TEMP/android-release"
          sha256sum RideNow-Rider-debug.apk RideNow-Driver-debug.apk RideNow-Android.zip RideNowDriver.zip ANDROID_SOURCE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridenow-android-apks-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ridenow-android-apks-${{ github.run_id }}
          path: android-release
      - name: Publish Rider and Driver APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-apps-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/android-release-notes.md" <<EOF
          RideNow Rider and Driver Android APKs built from commit ${GITHUB_SHA}.

          - Both APKs are debug-signed previews for installation and testing, not production or Play Store releases.
          - Rider and Driver source files and source ZIPs are included unchanged with checksums. For compilation only, Actions removes an unused duplicate Lock declaration from a temporary Driver build copy; repository source is untouched.
          - Gradle 8.9 wrappers are generated only in GitHub Actions and are not committed.
          - Debug signing keys may differ between runs; uninstall an older preview if Android rejects an update.
          - Minimum Android version: Android 8.0 (API 26).
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" android-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" android-release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "RideNow Rider and Driver APKs #${GITHUB_RUN_NUMBER}" \
              --notes-file "$RUNNER_TEMP/android-release-notes.md"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
