name: Android APK preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record unchanged source checksums
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          sha256sum app/android/RideNow-Android.zip > "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
          project_dir="$RUNNER_TEMP/ridenow-supplied-project"
          mkdir -p "$project_dir"
          unzip -q app/android/RideNow-Android.zip -d "$project_dir"
          test -f "$project_dir/RideNow/settings.gradle.kts"
          test -f "$project_dir/RideNow/app/src/main/AndroidManifest.xml"
          backdrop="$project_dir/RideNow/app/src/main/kotlin/com/ridenow/app/ui/components/Backdrop.kt"
          if ! rg -q '^import androidx.compose.ui.unit.dp$' "$backdrop"; then
            sed -i '/^import androidx.compose.ui.geometry.Offset$/a import androidx.compose.ui.unit.dp' "$backdrop"
          fi
      - name: Temporary compile-only scale import fix
        run: |
          file="$RUNNER_TEMP/ridenow-supplied-project/RideNow/app/src/main/kotlin/com/ridenow/app/ui/home/VectorScreen.kt"
          test -f "$file"
          if ! grep -q '^import androidx.compose.ui.draw.scale$' "$file"; then
            sed -i '/^package com.ridenow.app.ui.home$/a import androidx.compose.ui.draw.scale' "$file"
          fi
          grep -n '^import androidx.compose.ui.draw.scale$' "$file"
      - name: Generate wrapper outside the supplied project
        run: |
          wrapper_dir="$RUNNER_TEMP/ridenow-wrapper"
          mkdir -p "$wrapper_dir"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$wrapper_dir/settings.gradle.kts"
          gradle --no-daemon --project-dir "$wrapper_dir" wrapper --gradle-version 8.9 --distribution-type bin
          cp "$wrapper_dir/gradlew" app/android/gradlew
          cp "$wrapper_dir/gradlew.bat" app/android/gradlew.bat
          cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" app/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x app/android/gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build the supplied Android project
        run: |
          set -o pipefail
          app/android/gradlew --no-daemon --stacktrace --project-dir "$RUNNER_TEMP/ridenow-supplied-project/RideNow" :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Verify APK and preserve original sources
        run: |
          apk="$RUNNER_TEMP/ridenow-supplied-project/RideNow/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-apk-metadata.txt"
          head -5 "$RUNNER_TEMP/android-apk-metadata.txt"
          sha256sum --check "$RUNNER_TEMP/android-release/ANDROID_SOURCE_SHA256SUMS.txt"
          git diff --exit-code -- app/android
          cp "$apk" "$RUNNER_TEMP/android-release/RideNow-Android-debug.apk"
          cp app/android/RideNow-Android.zip "$RUNNER_TEMP/android-release/RideNow-Android.zip"
          cd "$RUNNER_TEMP/android-release"
          sha256sum RideNow-Android-debug.apk RideNow-Android.zip ANDROID_SOURCE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridenow-android-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
