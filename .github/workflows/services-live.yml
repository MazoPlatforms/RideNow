name: Supabase and Upstash connectivity test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: services-live-production
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Optional Supabase public CA certificate
        env:
          SUPABASE_CA_CERT: ${{ vars.SUPABASE_CA_CERT }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync,appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {X509Certificate} from 'node:crypto';
          const ca=process.env.SUPABASE_CA_CERT?.trim();
          if(ca){
            try{new X509Certificate(ca);}catch{throw new Error('SUPABASE_CA_CERT must contain a public PEM certificate');}
            const file=join(process.env.RUNNER_TEMP,'ridenow-supabase-ca.crt');
            writeFileSync(file,ca+'\n',{mode:0o600});
            appendFileSync(process.env.GITHUB_ENV,`NODE_EXTRA_CA_CERTS=${file}\n`);
          }
          JS
      - name: Test PostgreSQL, PostGIS, Redis TLS and Pub/Sub
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run test:services:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-smoke-report
          path: services-smoke-report.json
          if-no-files-found: ignore
          retention-days: 3
