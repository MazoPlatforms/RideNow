name: Cloudflare R2 storage test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-live-production
  cancel-in-progress: false
jobs:
  storage:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test R2 upload, verified copy and download
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION || secrets.S3_REGION || 'auto' }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: npm run test:storage:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-smoke-report
          path: storage-smoke-report.json
          if-no-files-found: ignore
          retention-days: 3
